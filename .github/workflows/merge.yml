name: CI Merge

on:
  pull_request:
    branches:
      - main

jobs:
  quality-checks-merge:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.28.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (generate dist + .d.ts)
        run: pnpm -r build

      - name: Run Typescript type checking
        run: pnpm typecheck

      - name: Run ESLint (no fix)
        run: pnpm lint

      - name: Run Prettier 
        run: pnpm format

      - name: Build web app
        run: pnpm --filter web build
