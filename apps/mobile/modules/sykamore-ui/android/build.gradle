buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.sykamoreui'
version = '0.0.1'

android {
  namespace "expo.modules.sykamoreui"
  defaultConfig {
    versionCode 1
    versionName "0.0.1"
  }
  buildFeatures {
    compose true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.compose.foundation:foundation-android:1.7.6'
  implementation 'androidx.compose.ui:ui-android:1.7.6'
  implementation "androidx.compose.material3:material3:1.5.0-alpha08"
  implementation 'androidx.compose.material3:material3-android:1.5.0-alpha08'
  implementation 'androidx.compose.material:material-icons-extended:1.7.6'
  implementation 'androidx.lifecycle:lifecycle-runtime:2.9.3'
  implementation 'androidx.fragment:fragment-ktx:1.8.9'
  implementation "androidx.graphics:graphics-shapes:1.0.1"
}
