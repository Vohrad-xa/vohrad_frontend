name: Push Workflow

on:
  push:

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.28.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (generate dist + .d.ts)
        run: pnpm -r build

      - name: Format
        run: pnpm format

      - name: Lint all apps
        run: pnpm lint

      - name: TypeScript check
        run: pnpm typecheck
